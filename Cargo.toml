[workspace]
members = ["crates/rusjango-core", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
authors = ["Rusjango Contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
